<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>启动助手 · 浏览器设置</title>
<link rel="stylesheet" href="style.css"><main>
<p class="eyebrow">启动提醒助手</p><h1>让允许的内容留下来</h1>
<p>只在主动专注期间生效。先在桌面助手的“安排与设置”中复制配对码。</p>
<section><h2>连接桌面助手</h2><label for="token">本机配对码（不是 AI 密钥）</label>
<input id="token" type="password" autocomplete="off"><button id="save">保存并连接</button><p id="connection" role="status">尚未连接</p></section>
<section><h2>导入学习视频或音乐</h2><p>粘贴一个 B 站视频链接。课程合集会提取其各集 BV 号，供你核对后加入允许列表；不会放行整个 B 站。</p>
<label for="video">视频链接或 BV 号</label><input id="video" placeholder="https://www.bilibili.com/video/BV…/">
<div><button id="single">提取单个视频</button><button id="collection">提取所属课程合集</button></div>
<p id="result" role="status"></p><textarea id="output" rows="8" readonly aria-label="提取结果"></textarea>
<button id="copy">加入桌面助手的允许列表</button>
<p class="muted">单个视频的所有分 P 都允许播放。合集按本次提取的视频列表放行；新增课程视频须在下一次专注前重新导入。</p></section>
<p class="muted">开始后无法通过助手提前结束。手动停用或卸载扩展仍可绕过限制，这是普通浏览器扩展的边界。</p>
</main><script src="options.js"></script></html>
